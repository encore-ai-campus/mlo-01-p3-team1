[project]
name = "cafe-ads-backend"
version = "0.1.0"
description = "광고 서버 개발 환경과 MongoDB 관리 데이터 계약"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Django>=5.2.8,<5.3",
  "djangorestframework>=3.16,<3.18",
  "drf-spectacular>=0.28,<0.30",
  "psycopg[binary]>=3.2,<4",
  "pymongo>=4.15,<5",
  "python-dotenv>=1,<2",
  "argon2-cffi>=23.1,<26",
  "Pillow>=11.3,<13",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
