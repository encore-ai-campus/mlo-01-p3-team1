name: mlo-ads-local

services:
  mongo:
    image: mongo:8.0.34-noble@sha256:0dc2511c4261bffa84f5af2c7df2aae148c0bea68d9b0aacd85c3d7be07e0583
    command: ["mongod", "--replSet", "ads-rs", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - "mongodb://127.0.0.1:27017/admin?directConnection=true"
        - --quiet
        - --eval
        - "const h = db.hello(); quit(h.isWritablePrimary && h.setName === 'ads-rs' ? 0 : 1);"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0.34-noble@sha256:0dc2511c4261bffa84f5af2c7df2aae148c0bea68d9b0aacd85c3d7be07e0583
    network_mode: "service:mongo"
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./init-replica-set.js:/scripts/init-replica-set.js:ro
    entrypoint:
      - mongosh
      - "mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=90000"
      - --quiet
      - --file
      - /scripts/init-replica-set.js
    restart: "no"

volumes:
  mongo-data:
