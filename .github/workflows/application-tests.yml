name: Application checks
on:
  push:
    paths: ['backend/**', 'ad-server/**', 'frontend/**', 'pipeline/**', 'music_playback/**', 'prototype/**', 'tests/**', 'scripts/**', 'config/**', 'docs/**', 'README.md', '.github/workflows/application-tests.yml']
  pull_request:
    paths: ['backend/**', 'ad-server/**', 'frontend/**', 'pipeline/**', 'music_playback/**', 'prototype/**', 'tests/**', 'scripts/**', 'config/**', 'docs/**', 'README.md', '.github/workflows/application-tests.yml']
permissions:
  contents: read
concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      C_LOCAL_DEMO: '1'
      INTEGRATION_ENABLED: '0'
      WEATHER_PROVIDER: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements.lock'}
      - run: python -m pip install -r backend/requirements.lock -r pipeline/weather/requirements.txt
      - run: python -m backend.manage test backend.common backend.music backend.recommendation backend.weather tests --noinput --verbosity 1
      - run: python -m backend.manage makemigrations --check --dry-run
      - run: python scripts/check_routing.py
      - run: python -m unittest discover -s prototype/youtube-player/tests -p test_server.py -v
  postgres-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: application_ci, POSTGRES_USER: postgres, POSTGRES_PASSWORD: ci-only-unused-outside-runner}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: '1'
      C_LOCAL_DEMO: '0'
      INTEGRATION_ENABLED: '0'
      DJANGO_SECRET_KEY: ci-test-only-unused-outside-runner
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: application_ci
      PGUSER: postgres
      PGPASSWORD: ci-only-unused-outside-runner
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements.lock'}
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m backend.manage test backend.common.test_exclusion_history backend.music.test_occasion_publication backend.recommendation.tests.test_catalog_publication backend.recommendation.tests.test_dispatch backend.recommendation.tests.test_cancellation backend.recommendation.tests.test_shared_youtube_database backend.recommendation.tests.test_youtube_collected_links --noinput --verbosity 2
  ads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-test-only-unused-outside-runner
      ADS_RUN_MONGO_TESTS: '1'
      ADS_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=ads-rs&directConnection=true
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.12'}
      - run: uv sync --locked --project ad-server/backend
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name ads-ci -p 127.0.0.1:27018:27018 mongo:8.0 mongod --port 27018 --bind_ip_all --replSet ads-rs
          for attempt in $(seq 1 30); do
            if docker exec ads-ci mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec ads-ci mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"ads-rs",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec ads-ci mongosh --port 27018 --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: uv run --locked python manage.py test tests --noinput --verbosity 1
        working-directory: ad-server/backend
      - if: always()
        run: docker rm -f ads-ci || true
  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PYTHONUTF8: '1', BROWSER_USE_BUILD: '1', VITE_C_DEMO: '1'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements.lock'}
      - run: python -m pip install -r backend/requirements.lock -r pipeline/weather/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: python tests/run_browser_integration.py
      - run: node --test prototype/youtube-player/tests/queue.test.mjs
