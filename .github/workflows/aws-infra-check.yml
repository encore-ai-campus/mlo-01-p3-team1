name: Infrastructure code checks
on:
  push:
    paths: ['aws-infra/**', 'docs/handoff/infra/**', '.github/workflows/aws-infra-check.yml', '.gitignore']
  pull_request:
    paths: ['aws-infra/**', 'docs/handoff/infra/**', '.github/workflows/aws-infra-check.yml', '.gitignore']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-infra
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect publishable files
        run: python3 bin/check-public.py
      - name: Run offline safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated sample templates
        run: |
          python3 bin/infra.py --config config/project.example.json render
          git -C .. diff --exit-code -- aws-infra/templates
      - name: Install pinned linter
        run: python3 -m pip install -r requirements-validation.txt
      - name: Validate sample CloudFormation schemas
        run: cfn-lint -t templates/*.json -r ap-northeast-2 -f json
